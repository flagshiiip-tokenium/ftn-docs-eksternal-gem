<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%" role="img" aria-label="Perjalanan token: scan, klaim, tersimpan di wallet">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#14151A" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1B22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111217" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="amberGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoin6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadowGlow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#CC710B" flood-opacity="0.2" />
    </filter>
    <filter id="dotGlow6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlow6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="326" rx="20" fill="url(#bgGrad6)" stroke="#26211A" stroke-width="1.5" />

  <!-- Top Header Badge -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#dotGlow6)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E68817" letter-spacing="1">ALUR TOKENOMIK FTN</text>
    <text x="235" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF">Tahapan perjalanan reward token loyalitas dari kemasan hingga wallet Anda</text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(25, 66)">
    <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#cardGrad6)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow6)" />
    <rect x="1" y="1" width="278" height="3" rx="1.5" fill="url(#amberGrad6)" />

    <!-- Step Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="url(#amberGrad6)" />
    <text x="33" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <text x="58" y="35" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#CC710B" letter-spacing="0.5">VALIDASI PRODUK</text>

    <!-- Visual: Phone Scan with Verification Check -->
    <g transform="translate(140, 95)">
      <!-- Phone Frame -->
      <rect x="-22" y="-36" width="44" height="72" rx="8" fill="#15171C" stroke="#4A3420" stroke-width="1.8" />
      <rect x="-18" y="-30" width="36" height="60" rx="5" fill="#0D0E12" />
      <!-- Scanning laser -->
      <line x1="-14" y1="-8" x2="14" y2="-8" stroke="#CC710B" stroke-width="2" />
      <polygon points="-14,-8 14,-8 10,-18 -10,-18" fill="#CC710B" fill-opacity="0.2" />
      <!-- Shield checkmark -->
      <circle cx="0" cy="12" r="11" fill="#10B981" />
      <path d="M-4 12 L-1 15 L5 9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Info -->
    <text x="140" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Scan &amp; Verifikasi</text>
    <text x="140" y="196" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Pastikan hasil scan terbukti asli.</text>
    <text x="140" y="214" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Hak klaim reward terbuka.</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(308, 175)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="4 3" />
    <polygon points="32,0 23,-5 23,5" fill="#CC710B" />
    <circle cx="14" cy="0" r="3" fill="#F59E0B" filter="url(#dotGlow6)" />
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(340, 66)">
    <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#cardGrad6)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow6)" />
    <rect x="1" y="1" width="278" height="3" rx="1.5" fill="url(#amberGrad6)" />

    <!-- Step Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="url(#amberGrad6)" />
    <text x="33" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
    <text x="58" y="35" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#CC710B" letter-spacing="0.5">KONTRAK PINTAR</text>

    <!-- Visual: Smart Contract & Token Release -->
    <g transform="translate(140, 95)">
      <!-- Contract Document -->
      <rect x="-24" y="-28" width="48" height="56" rx="6" fill="#1C1813" stroke="#4B3B2B" stroke-width="1.5" />
      <line x1="-14" y1="-16" x2="6" y2="-16" stroke="#CC710B" stroke-width="2" stroke-linecap="round" />
      <line x1="-14" y1="-8" x2="14" y2="-8" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-14" y1="0" x2="10" y2="0" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" />
      <!-- Minting Coin Animation Effect -->
      <g transform="translate(14, 14)">
        <circle cx="0" cy="0" r="16" fill="url(#goldCoin6)" stroke="#92400E" stroke-width="1.5" filter="url(#goldGlow6)" />
        <polygon points="0,-8 6,-1 0,8 -6,-1" fill="#FFFFFF" fill-opacity="0.9" />
      </g>
      <!-- Sparkles -->
      <circle cx="-16" cy="18" r="2.5" fill="#FDE047" />
    </g>

    <!-- Info -->
    <text x="140" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Klaim Hadiah Token</text>
    <text x="140" y="196" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Kontrak pintar di Polygon</text>
    <text x="140" y="214" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">mencetak token FTN secara gasless</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(623, 175)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="4 3" />
    <polygon points="32,0 23,-5 23,5" fill="#CC710B" />
    <circle cx="14" cy="0" r="3" fill="#F59E0B" filter="url(#dotGlow6)" />
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(655, 66)">
    <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#cardGrad6)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlow6)" />
    <rect x="1" y="1" width="278" height="3" rx="1.5" fill="url(#amberGrad6)" />

    <!-- Step Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="url(#amberGrad6)" />
    <text x="33" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
    <text x="58" y="35" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E68817" letter-spacing="0.5">DOMPET PRIBADI</text>

    <!-- Visual: Web3 Wallet with Balance Badge -->
    <g transform="translate(140, 95)">
      <!-- Wallet Body -->
      <rect x="-30" y="-18" width="60" height="42" rx="8" fill="#1E1912" stroke="#CC710B" stroke-width="2" />
      <path d="M-30 -4 H18 C24 -4 28 0 28 6 C28 12 24 16 18 16 H-30" fill="#292014" stroke="#4A3420" stroke-width="1.5" />
      <!-- Wallet Clasp with Token Coin -->
      <circle cx="18" cy="6" r="6" fill="#F59E0B" />
      
      <!-- Balance Floating Tag -->
      <rect x="-24" y="-34" width="52" height="18" rx="9" fill="#10B981" filter="url(#goldGlow6)" />
      <text x="2" y="-21" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">+25 FTN</text>
    </g>

    <!-- Info -->
    <text x="140" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Token Masuk Wallet</text>
    <text x="140" y="196" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Tersimpan permanen di wallet,</text>
    <text x="140" y="214" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">milik Anda &amp; tanpa kedaluwarsa</text>
  </g>
</svg>