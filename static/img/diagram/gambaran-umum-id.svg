<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%" role="img" aria-label="Gambaran umum Flagshiiip dalam tiga langkah">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#14151A" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1B22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111217" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#CC710B" flood-opacity="0.2" />
    </filter>
    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Main Container -->
  <rect x="2" y="2" width="956" height="326" rx="20" fill="url(#bgGrad)" stroke="#26211A" stroke-width="1.5" />

  <!-- Top Decorative Header / Badge -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#dotGlow)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E68817" letter-spacing="1">ALUR UTAMA EKOSISTEM</text>
    <text x="235" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF">Bagaimana Flagshiiip menghubungkan brand fisik dengan sertifikat digital</text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(25, 66)">
    <!-- Card Base -->
    <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#cardGrad)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow)" />
    <rect x="1" y="1" width="278" height="3" rx="1.5" fill="url(#amberGrad)" />

    <!-- Step Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="url(#amberGrad)" />
    <text x="33" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <text x="58" y="35" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#CC710B" letter-spacing="0.5">PRODUSEN / BRAND</text>

    <!-- Visual Illustration: 3D Box with QR Seal -->
    <g transform="translate(140, 95)">
      <!-- Isometric Product Box -->
      <polygon points="0,-35 48,-15 0,5 -48,-15" fill="#3D2613" stroke="#5C3A1D" stroke-width="1" />
      <polygon points="-48,-15 0,5 0,48 -48,28" fill="#29180B" stroke="#42250E" stroke-width="1" />
      <polygon points="0,5 48,-15 48,28 0,48" fill="#1C1007" stroke="#331C0B" stroke-width="1" />
      <!-- Tape / Seal -->
      <polygon points="-12,-20 12,-10 12,-4 -12,-14" fill="#CC710B" fill-opacity="0.8" />
      <!-- Smart QR Sticker on Box Face -->
      <g transform="translate(-36, 0) skewY(22) scale(0.65)">
        <rect x="0" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CC710B" stroke-width="2" />
        <!-- Mini QR pattern -->
        <rect x="4" y="4" width="10" height="10" fill="#111827" />
        <rect x="6" y="6" width="6" height="6" fill="#FFFFFF" />
        <rect x="22" y="4" width="10" height="10" fill="#111827" />
        <rect x="24" y="6" width="6" height="6" fill="#FFFFFF" />
        <rect x="4" y="22" width="10" height="10" fill="#111827" />
        <rect x="6" y="24" width="6" height="6" fill="#FFFFFF" />
        <rect x="18" y="18" width="5" height="5" fill="#CC710B" />
        <rect x="26" y="24" width="6" height="6" fill="#111827" />
      </g>
      <!-- Halo Aura around sticker -->
      <circle cx="-24" cy="12" r="18" fill="#CC710B" fill-opacity="0.25" filter="url(#dotGlow)" />
    </g>

    <!-- Title & Description -->
    <text x="140" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Brand Memasang Stiker</text>
    <text x="140" y="196" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Stiker QR pintar kriptografis</text>
    <text x="140" y="214" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">ditempel saat produksi barang</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(308, 175)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="4 3" />
    <polygon points="32,0 23,-5 23,5" fill="#CC710B" />
    <circle cx="14" cy="0" r="3" fill="#F59E0B" filter="url(#dotGlow)" />
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(340, 66)">
    <!-- Card Base -->
    <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#cardGrad)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow)" />
    <rect x="1" y="1" width="278" height="3" rx="1.5" fill="url(#amberGrad)" />

    <!-- Step Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="url(#amberGrad)" />
    <text x="33" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
    <text x="58" y="35" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#CC710B" letter-spacing="0.5">DISTRIBUSI &amp; RETAIL</text>

    <!-- Visual Illustration: Shopping / Delivery with Shield -->
    <g transform="translate(140, 95)">
      <!-- Delivery / Bag Silhouette -->
      <rect x="-30" y="-18" width="60" height="52" rx="8" fill="#241B13" stroke="#4A3420" stroke-width="1.5" />
      <!-- Handles -->
      <path d="M-14 -18 C -14 -32, 14 -32, 14 -18" fill="none" stroke="#CC710B" stroke-width="2.5" stroke-linecap="round" />
      <!-- Verified Security Shield in Front of Bag -->
      <g transform="translate(0, 10)">
        <path d="M0 -20 L18 -12 V4 C18 16 0 24 0 24 C0 24 -18 16 -18 4 V-12 Z" fill="#121816" stroke="url(#emeraldGrad)" stroke-width="2" />
        <path d="M-6 2 L-1 7 L8 -3" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <!-- Trust Dots -->
      <circle cx="28" cy="-8" r="3" fill="#CC710B" opacity="0.8" />
      <circle cx="-26" cy="22" r="2.5" fill="#34D399" opacity="0.8" />
    </g>

    <!-- Title & Description -->
    <text x="140" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Produk Sampai ke Anda</text>
    <text x="140" y="196" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Anda membeli produk original</text>
    <text x="140" y="214" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">di toko offline maupun online</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(623, 175)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="4 3" />
    <polygon points="32,0 23,-5 23,5" fill="#CC710B" />
    <circle cx="14" cy="0" r="3" fill="#F59E0B" filter="url(#dotGlow)" />
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(655, 66)">
    <!-- Card Base -->
    <rect x="0" y="0" width="280" height="240" rx="16" fill="url(#cardGrad)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlow)" />
    <rect x="1" y="1" width="278" height="3" rx="1.5" fill="url(#amberGrad)" />

    <!-- Step Badge -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="url(#amberGrad)" />
    <text x="33" y="36" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
    <text x="58" y="35" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E68817" letter-spacing="0.5">KONSUMEN / PEMBELI</text>

    <!-- Visual Illustration: Smartphone with Laser Scan & FTN Coin -->
    <g transform="translate(130, 95)">
      <!-- Phone Body -->
      <rect x="-24" y="-36" width="48" height="74" rx="9" fill="#0D0E12" stroke="#4A3420" stroke-width="1.8" />
      <rect x="-20" y="-30" width="40" height="62" rx="6" fill="#14181B" />
      <!-- Camera notch -->
      <rect x="-6" y="-34" width="12" height="3" rx="1.5" fill="#374151" />
      
      <!-- Scan Beam -->
      <line x1="-16" y1="-5" x2="16" y2="-5" stroke="#CC710B" stroke-width="2" />
      <polygon points="-16,-5 16,-5 12,-16 -12,-16" fill="#CC710B" fill-opacity="0.18" />
      
      <!-- Verified Result on Screen -->
      <circle cx="0" cy="12" r="10" fill="#10B981" />
      <path d="M-4 12 L-1 15 L5 9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Floating FTN Coin -->
      <g transform="translate(34, -14)">
        <circle cx="0" cy="0" r="14" fill="url(#goldCoin)" stroke="#92400E" stroke-width="1.5" filter="url(#dotGlow)" />
        <polygon points="0,-8 6,-1 0,8 -6,-1" fill="#FFFFFF" fill-opacity="0.9" />
      </g>
    </g>

    <!-- Title & Description -->
    <text x="140" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Anda Scan &amp; Verifikasi</text>
    <text x="140" y="196" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Aplikasi membuktikan keaslian</text>
    <text x="140" y="214" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">&amp; memberi sertifikat + token FTN</text>
  </g>
</svg>