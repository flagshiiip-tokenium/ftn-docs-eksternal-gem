<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 710" width="100%" height="100%" role="img" aria-label="Alur tokenomik FTN dalam 3 langkah (versi ponsel)">
  <defs>
    <linearGradient id="bgGradMob6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="cardGradMob6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#f9fafb" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGradMob6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoinMob6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadowGlowMob6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="dotGlowMob6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlowMob6" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="416" height="706" rx="20" fill="url(#bgGradMob6)" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="175" height="24" rx="12" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#CC710B" filter="url(#dotGlowMob6)" />
    <text x="22" y="15.5" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#8f4f08" letter-spacing="0.8">ALUR TOKENOMIK</text>
    <text x="185" y="16.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6b7280">3 Tahap Reward FTN</text>
  </g>

  <!-- ==================== STEP 1: VALIDASI PRODUK ==================== -->
  <g transform="translate(20, 56)">
    <rect x="0" y="0" width="380" height="185" rx="16" fill="url(#cardGradMob6)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlowMob6)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob6)" />

    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#amberGradMob6)" />
    <text x="30" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">1</text>
    <text x="52" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="0.5">VALIDASI PRODUK</text>

    <!-- Visual -->
    <g transform="translate(68, 110)">
      <rect x="-20" y="-30" width="40" height="60" rx="7" fill="#15171C" stroke="#d1d5db" stroke-width="1.5" />
      <rect x="-16" y="-25" width="32" height="50" rx="5" fill="#ffffff" />
      <line x1="-12" y1="-7" x2="12" y2="-7" stroke="#CC710B" stroke-width="1.8" />
      <polygon points="-12,-7 12,-7 8,-15 -8,-15" fill="#CC710B" fill-opacity="0.25" />
      <circle cx="0" cy="10" r="10" fill="#10B981" />
      <path d="M-4 10 L-1 13 L5 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(125, 68)">
      <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Scan &amp; Verifikasi</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Pastikan hasil scan terbukti asli.</text>
      <text x="0" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Hak klaim reward terbuka seketika.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(210, 249)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="0,24 -4,15 4,15" fill="#CC710B" />
    <circle cx="0" cy="9" r="2.5" fill="#F59E0B" filter="url(#dotGlowMob6)" />
  </g>

  <!-- ==================== STEP 2: KONTRAK PINTAR ==================== -->
  <g transform="translate(20, 276)">
    <rect x="0" y="0" width="380" height="185" rx="16" fill="url(#cardGradMob6)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlowMob6)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob6)" />

    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#amberGradMob6)" />
    <text x="30" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">2</text>
    <text x="52" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="0.5">KONTRAK PINTAR</text>

    <!-- Visual -->
    <g transform="translate(68, 110)">
      <rect x="-20" y="-24" width="40" height="48" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
      <line x1="-12" y1="-14" x2="4" y2="-14" stroke="#CC710B" stroke-width="1.8" stroke-linecap="round" />
      <line x1="-12" y1="-7" x2="12" y2="-7" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" />
      <line x1="-12" y1="0" x2="8" y2="0" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" />
      <g transform="translate(12, 12)">
        <circle cx="0" cy="0" r="14" fill="url(#goldCoinMob6)" stroke="#92400E" stroke-width="1.2" filter="url(#goldGlowMob6)" />
        <polygon points="0,-7 5,-1 0,7 -5,-1" fill="#FFFFFF" fill-opacity="0.9" />
      </g>
    </g>

    <g transform="translate(125, 68)">
      <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Klaim Hadiah Token</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Kontrak pintar di Polygon mencetak</text>
      <text x="0" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">token FTN secara gasless &amp; otomatis.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(210, 469)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="0,24 -4,15 4,15" fill="#CC710B" />
    <circle cx="0" cy="9" r="2.5" fill="#F59E0B" filter="url(#dotGlowMob6)" />
  </g>

  <!-- ==================== STEP 3: DOMPET PRIBADI ==================== -->
  <g transform="translate(20, 496)">
    <rect x="0" y="0" width="380" height="195" rx="16" fill="url(#cardGradMob6)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlowMob6)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob6)" />

    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#amberGradMob6)" />
    <text x="30" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">3</text>
    <text x="52" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="0.5">DOMPET PRIBADI</text>

    <!-- Visual -->
    <g transform="translate(68, 115)">
      <rect x="-26" y="-16" width="52" height="36" rx="7" fill="#1E1912" stroke="#CC710B" stroke-width="1.8" />
      <path d="M-26 -4 H16 C21 -4 25 0 25 5 C25 10 21 14 16 14 H-26" fill="#292014" stroke="#d1d5db" stroke-width="1.2" />
      <circle cx="16" cy="5" r="5" fill="#F59E0B" />
      <rect x="-22" y="-28" width="46" height="16" rx="8" fill="#10B981" filter="url(#goldGlowMob6)" />
      <text x="1" y="-16.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#111827">+25 FTN</text>
    </g>

    <g transform="translate(125, 68)">
      <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Token Masuk Wallet</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Tersimpan permanen di wallet,</text>
      <text x="0" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">100% milik Anda tanpa batas kedaluwarsa.</text>
    </g>
  </g>
</svg>
