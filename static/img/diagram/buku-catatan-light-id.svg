<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" role="img" aria-label="Buku catatan bersama yang disalin di banyak tempat">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f9fafb" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="emeraldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadowGlow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="dotGlow4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
    <filter id="emeraldGlow4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="376" rx="20" fill="url(#bgGrad4)" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="235" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#dotGlow4)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="1">DESENTRALISASI BLOCKCHAIN</text>
    <text x="250" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6b7280">Buku catatan bersama terenkripsi yang disinkronkan secara global</text>
  </g>

  <!-- ==================== TOP CARD: BUKU CATATAN BERSAMA ==================== -->
  <g transform="translate(230, 60)">
    <rect x="0" y="0" width="500" height="106" rx="16" fill="url(#cardGrad4)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlow4)" />
    <rect x="1" y="1" width="498" height="3" rx="1.5" fill="url(#amberGrad4)" />

    <!-- Ledger & Blockchain Icon -->
    <g transform="translate(50, 52)">
      <!-- Ledger Book -->
      <rect x="-24" y="-22" width="48" height="44" rx="6" fill="#ffffff" stroke="#CC710B" stroke-width="2" />
      <!-- Book spine & lines -->
      <line x1="-8" y1="-22" x2="-8" y2="22" stroke="#d1d5db" stroke-width="2" />
      <line x1="-2" y1="-10" x2="16" y2="-10" stroke="#CC710B" stroke-width="2" stroke-linecap="round" />
      <line x1="-2" y1="-2" x2="16" y2="-2" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-2" y1="6" x2="16" y2="6" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-2" y1="14" x2="10" y2="14" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" />
      <!-- Lock Badge -->
      <circle cx="20" cy="18" r="9" fill="#10B981" />
      <path d="M17 18 L19 20 L24 15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Info -->
    <g transform="translate(95, 20)">
      <rect x="0" y="0" width="165" height="18" rx="9" fill="#CC710B" fill-opacity="0.15" stroke="#CC710B" stroke-width="0.8" />
      <text x="82" y="12" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#8f4f08">DISTRIBUTED SHARED LEDGER</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Buku Catatan Digital Bersama</text>
      <text x="0" y="58" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Catatan riwayat &amp; sertifikat keaslian produk disimpan permanen.</text>
      <text x="0" y="74" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#8f4f08">Setiap perubahan data divalidasi oleh konsensus kriptografi jaringan.</text>
    </g>
  </g>

  <!-- ==================== CONNECTING NETWORK LINES ==================== -->
  <!-- Left Link -->
  <path d="M 370 166 L 165 204" fill="none" stroke="#CC710B" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="267" cy="185" r="3.5" fill="#CC710B" filter="url(#dotGlow4)" />

  <!-- Center Link -->
  <path d="M 480 166 L 480 204" fill="none" stroke="#CC710B" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="480" cy="185" r="3.5" fill="#CC710B" filter="url(#dotGlow4)" />

  <!-- Right Link -->
  <path d="M 590 166 L 795 204" fill="none" stroke="#CC710B" stroke-width="2" stroke-dasharray="4 3" />
  <circle cx="692" cy="185" r="3.5" fill="#CC710B" filter="url(#dotGlow4)" />

  <!-- ==================== 3 VALIDATOR NODES ==================== -->
  <!-- Node 1 -->
  <g transform="translate(25, 206)">
    <rect x="0" y="0" width="280" height="110" rx="14" fill="url(#cardGrad4)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlow4)" />
    
    <!-- Server Stack Graphic -->
    <g transform="translate(32, 55)">
      <rect x="-18" y="-24" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="-18" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="-18" x2="10" y2="-18" stroke="#d1d5db" stroke-width="2" />

      <rect x="-18" y="-8" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="-2" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="-2" x2="10" y2="-2" stroke="#d1d5db" stroke-width="2" />

      <rect x="-18" y="8" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="14" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="14" x2="10" y2="14" stroke="#d1d5db" stroke-width="2" />
    </g>

    <g transform="translate(68, 18)">
      <rect x="0" y="0" width="115" height="18" rx="9" fill="#10B981" fill-opacity="0.15" />
      <text x="57" y="12" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#047857">● SINKRON &amp; TERVERIFIKASI</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Node Salinan 1</text>
      <text x="0" y="56" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Komputer validator di lokasi A</text>
      <text x="0" y="72" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">memegang duplikat data sah.</text>
    </g>
  </g>

  <!-- Node 2 -->
  <g transform="translate(340, 206)">
    <rect x="0" y="0" width="280" height="110" rx="14" fill="url(#cardGrad4)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlow4)" />
    
    <g transform="translate(32, 55)">
      <rect x="-18" y="-24" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="-18" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="-18" x2="10" y2="-18" stroke="#d1d5db" stroke-width="2" />

      <rect x="-18" y="-8" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="-2" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="-2" x2="10" y2="-2" stroke="#d1d5db" stroke-width="2" />

      <rect x="-18" y="8" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="14" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="14" x2="10" y2="14" stroke="#d1d5db" stroke-width="2" />
    </g>

    <g transform="translate(68, 18)">
      <rect x="0" y="0" width="115" height="18" rx="9" fill="#10B981" fill-opacity="0.15" />
      <text x="57" y="12" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#047857">● SINKRON &amp; TERVERIFIKASI</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Node Salinan 2</text>
      <text x="0" y="56" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Komputer validator di lokasi B</text>
      <text x="0" y="72" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">memvalidasi setiap hash blok.</text>
    </g>
  </g>

  <!-- Node 3 -->
  <g transform="translate(655, 206)">
    <rect x="0" y="0" width="280" height="110" rx="14" fill="url(#cardGrad4)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlow4)" />
    
    <g transform="translate(32, 55)">
      <rect x="-18" y="-24" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="-18" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="-18" x2="10" y2="-18" stroke="#d1d5db" stroke-width="2" />

      <rect x="-18" y="-8" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="-2" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="-2" x2="10" y2="-2" stroke="#d1d5db" stroke-width="2" />

      <rect x="-18" y="8" width="36" height="12" rx="3" fill="#ffffff" stroke="#CC710B" stroke-width="1.2" />
      <circle cx="-10" cy="14" r="2" fill="#10B981" filter="url(#emeraldGlow4)" />
      <line x1="-2" y1="14" x2="10" y2="14" stroke="#d1d5db" stroke-width="2" />
    </g>

    <g transform="translate(68, 18)">
      <rect x="0" y="0" width="115" height="18" rx="9" fill="#10B981" fill-opacity="0.15" />
      <text x="57" y="12" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#047857">● SINKRON &amp; TERVERIFIKASI</text>
      <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Node Salinan 3</text>
      <text x="0" y="56" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Komputer validator di lokasi C</text>
      <text x="0" y="72" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">menolak salinan yang tidak cocok.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SECURITY BANNER ==================== -->
  <g transform="translate(25, 328)">
    <rect x="0" y="0" width="910" height="36" rx="10" fill="#ffffff" stroke="#CC710B" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="20" cy="18" r="8" fill="#CC710B" fill-opacity="0.2" />
    <path d="M20 12 L24 14 V19 C24 22 20 24 20 24 C20 24 16 22 16 19 V14 Z" fill="#CC710B" />
    <text x="36" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F3F4F6">Jaminan Anti-Manipulasi:</text>
    <text x="195" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Semua salinan wajib 100% cocok. Jika ada yang mencoba mengubah data secara diam-diam, seluruh jaringan otomatis menolak.</text>
  </g>
</svg>