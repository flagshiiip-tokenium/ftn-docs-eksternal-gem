<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%" height="100%" role="img" aria-label="Buyer flow: download app, scan QR, see result, claim reward">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#14151A" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1B22" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#111217" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#CC710B" flood-opacity="0.15" />
    </filter>
    <filter id="dotGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="996" height="326" rx="20" fill="url(#bgGrad2)" stroke="#26211A" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="190" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#dotGlow2)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E68817" letter-spacing="1">4 BUYER STEPS</text>
    <text x="205" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF">Simple flow to verify product authenticity and claim rewards</text>
  </g>

  <!-- ==================== CARD 1: DOWNLOAD APP ==================== -->
  <g transform="translate(20, 64)">
    <rect x="0" y="0" width="225" height="244" rx="16" fill="url(#cardGrad2)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow2)" />
    <rect x="1" y="1" width="223" height="3" rx="1.5" fill="url(#amberGrad2)" />

    <!-- Step Chip -->
    <rect x="14" y="14" width="28" height="28" rx="8" fill="url(#amberGrad2)" />
    <text x="28" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">1</text>
    <text x="50" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CC710B" letter-spacing="0.5">INSTALLATION</text>

    <!-- Visual: Phone with Download Icon -->
    <g transform="translate(112, 95)">
      <rect x="-20" y="-34" width="40" height="66" rx="8" fill="#15171C" stroke="#4B3B2B" stroke-width="1.8" />
      <rect x="-16" y="-28" width="32" height="54" rx="5" fill="#0D0E12" />
      <circle cx="0" cy="-2" r="14" fill="#CC710B" fill-opacity="0.18" stroke="#CC710B" stroke-width="1.5" />
      <path d="M0 -9 L0 5 M-4 1 L0 5 L4 1" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="-24" y="14" width="48" height="9" rx="4.5" fill="#241B13" stroke="#CC710B" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="21" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="6.5" font-weight="700" fill="#E68817">GOOGLE PLAY</text>
    </g>

    <!-- Content -->
    <text x="112" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Download the App</text>
    <text x="112" y="194" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Available free on Android</text>
    <text x="112" y="212" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Sign in or create an account</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(247, 180)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="20,0 13,-4 13,4" fill="#CC710B" />
  </g>

  <!-- ==================== CARD 2: SCAN QR ==================== -->
  <g transform="translate(270, 64)">
    <rect x="0" y="0" width="225" height="244" rx="16" fill="url(#cardGrad2)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow2)" />
    <rect x="1" y="1" width="223" height="3" rx="1.5" fill="url(#amberGrad2)" />

    <!-- Step Chip -->
    <rect x="14" y="14" width="28" height="28" rx="8" fill="url(#amberGrad2)" />
    <text x="28" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2</text>
    <text x="50" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CC710B" letter-spacing="0.5">SCANNING</text>

    <!-- Visual: Camera Viewfinder with QR & Laser -->
    <g transform="translate(112, 95)">
      <path d="M-26 -16 V-26 H-16" fill="none" stroke="#CC710B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M26 -16 V-26 H16" fill="none" stroke="#CC710B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M-26 16 V26 H-16" fill="none" stroke="#CC710B" stroke-width="2.5" stroke-linecap="round" />
      <path d="M26 16 V26 H16" fill="none" stroke="#CC710B" stroke-width="2.5" stroke-linecap="round" />
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#FFFFFF" />
      <rect x="-14" y="-14" width="10" height="10" fill="#111827" />
      <rect x="-12" y="-12" width="6" height="6" fill="#FFFFFF" />
      <rect x="4" y="-14" width="10" height="10" fill="#111827" />
      <rect x="6" y="-12" width="6" height="6" fill="#FFFFFF" />
      <rect x="-14" y="4" width="10" height="10" fill="#111827" />
      <rect x="-12" y="6" width="6" height="6" fill="#FFFFFF" />
      <rect x="2" y="4" width="6" height="6" fill="#CC710B" />
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#CC710B" stroke-width="2" />
      <polygon points="-24,0 24,0 18,-10 -18,-10" fill="#CC710B" fill-opacity="0.25" />
    </g>

    <!-- Content -->
    <text x="112" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Scan QR Sticker</text>
    <text x="112" y="194" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Point phone camera at</text>
    <text x="112" y="212" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">the unique product sticker</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(497, 180)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="20,0 13,-4 13,4" fill="#CC710B" />
  </g>

  <!-- ==================== CARD 3: VERIFICATION RESULT ==================== -->
  <g transform="translate(520, 64)">
    <rect x="0" y="0" width="225" height="244" rx="16" fill="url(#cardGrad2)" stroke="#33271D" stroke-width="1.5" filter="url(#shadowGlow2)" />
    <rect x="1" y="1" width="223" height="3" rx="1.5" fill="url(#amberGrad2)" />

    <!-- Step Chip -->
    <rect x="14" y="14" width="28" height="28" rx="8" fill="url(#amberGrad2)" />
    <text x="28" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
    <text x="50" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CC710B" letter-spacing="0.5">VALIDATION</text>

    <!-- Visual: Verified Shield with Ribbon -->
    <g transform="translate(112, 95)">
      <path d="M0 -26 L22 -16 V2 C22 18 0 28 0 28 C0 28 -22 18 -22 2 V-16 Z" fill="#141E1A" stroke="url(#emeraldGrad2)" stroke-width="2.2" />
      <circle cx="0" cy="4" r="14" fill="#064E3B" />
      <path d="M-5 4 L-1 8 L7 0" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="18" cy="-18" r="3" fill="#F59E0B" filter="url(#dotGlow2)" />
      <rect x="-24" y="24" width="48" height="10" rx="5" fill="#065F46" />
      <text x="0" y="31.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#D1FAE5">VERIFIED</text>
    </g>

    <!-- Content -->
    <text x="112" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">View Result</text>
    <text x="112" y="194" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Official certificate &amp;</text>
    <text x="112" y="212" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">product history show instantly</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(747, 180)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="20,0 13,-4 13,4" fill="#CC710B" />
  </g>

  <!-- ==================== CARD 4: CLAIM REWARD ==================== -->
  <g transform="translate(770, 64)">
    <rect x="0" y="0" width="225" height="244" rx="16" fill="url(#cardGrad2)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlow2)" />
    <rect x="1" y="1" width="223" height="3" rx="1.5" fill="url(#amberGrad2)" />

    <!-- Step Chip -->
    <rect x="14" y="14" width="28" height="28" rx="8" fill="url(#amberGrad2)" />
    <text x="28" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">4</text>
    <text x="50" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E68817" letter-spacing="0.5">FTN REWARD</text>

    <!-- Visual: Gift Box + Radiating FTN Coin -->
    <g transform="translate(112, 95)">
      <rect x="-20" y="-8" width="40" height="32" rx="4" fill="#3D2613" stroke="#CC710B" stroke-width="1.5" />
      <rect x="-24" y="-16" width="48" height="10" rx="3" fill="#CC710B" />
      <rect x="-4" y="-16" width="8" height="40" fill="#F59E0B" />
      <g transform="translate(0, -26)">
        <circle cx="0" cy="0" r="14" fill="url(#goldCoin2)" stroke="#92400E" stroke-width="1.5" filter="url(#dotGlow2)" />
        <polygon points="0,-7 6,-1 0,7 -6,-1" fill="#FFFFFF" fill-opacity="0.9" />
      </g>
      <polygon points="22,-20 23.5,-16 27,-15 23.5,-14 22,-10 20.5,-14 17,-15 20.5,-16" fill="#FDE047" />
      <polygon points="-22,-22 -20.5,-18 -17,-17 -20.5,-16 -22,-12 -23.5,-16 -27,-17 -23.5,-18" fill="#CC710B" />
    </g>

    <!-- Content -->
    <text x="112" y="172" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Claim Token Reward</text>
    <text x="112" y="194" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">Receive FTN tokens sent</text>
    <text x="112" y="212" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">to your wallet from the brand</text>
  </g>
</svg>