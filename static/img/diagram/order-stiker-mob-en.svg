<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 920" role="img" aria-label="Sticker ordering workflow in five steps">
  <rect x="1" y="1" width="418" height="918" rx="22" fill="#0E0F12" stroke="#26211A" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="16" y="16" width="388" height="150" rx="18" fill="#1A1B22" stroke="#33271D" stroke-width="2"/>
      <circle cx="48" cy="50" r="20" fill="#CC710B"/>
      <text x="48" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
      <text x="80" y="48" font-size="12" font-weight="700" fill="#E68817">REGISTRATION</text>
      <text x="34" y="94" font-size="19" font-weight="700" fill="#FFFFFF">Register &amp; Verify</text>
      <text x="34" y="122" font-size="13" fill="#9CA3AF">Create an account, verify your email,</text>
      <text x="34" y="143" font-size="13" fill="#9CA3AF">then log in to the dashboard.</text>
    </g>
    <path d="M210 168v22m-7-8 7 8 7-8" fill="none" stroke="#CC710B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="16" y="196" width="388" height="150" rx="18" fill="#1A1B22" stroke="#33271D" stroke-width="2"/>
      <circle cx="48" cy="230" r="20" fill="#CC710B"/>
      <text x="48" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
      <text x="80" y="228" font-size="12" font-weight="700" fill="#E68817">BUSINESS PROFILE</text>
      <text x="34" y="274" font-size="19" font-weight="700" fill="#FFFFFF">Complete Profile</text>
      <text x="34" y="302" font-size="13" fill="#9CA3AF">Enter business details and upload</text>
      <text x="34" y="323" font-size="13" fill="#9CA3AF">the required documents for review.</text>
    </g>
    <path d="M210 348v22m-7-8 7 8 7-8" fill="none" stroke="#CC710B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="16" y="376" width="388" height="150" rx="18" fill="#1A1B22" stroke="#33271D" stroke-width="2"/>
      <circle cx="48" cy="410" r="20" fill="#CC710B"/>
      <text x="48" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
      <text x="80" y="408" font-size="12" font-weight="700" fill="#E68817">PRODUCT DATA</text>
      <text x="34" y="454" font-size="19" font-weight="700" fill="#FFFFFF">Register Product</text>
      <text x="34" y="482" font-size="13" fill="#9CA3AF">Add product details, store links, and</text>
      <text x="34" y="503" font-size="13" fill="#9CA3AF">the requested documents.</text>
    </g>
    <path d="M210 528v22m-7-8 7 8 7-8" fill="none" stroke="#CC710B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="16" y="556" width="388" height="150" rx="18" fill="#1A1B22" stroke="#33271D" stroke-width="2"/>
      <circle cx="48" cy="590" r="20" fill="#CC710B"/>
      <text x="48" y="596" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
      <text x="80" y="588" font-size="12" font-weight="700" fill="#E68817">ORDER STICKERS</text>
      <text x="34" y="634" font-size="19" font-weight="700" fill="#FFFFFF">Order &amp; Pay</text>
      <text x="34" y="662" font-size="13" fill="#9CA3AF">Choose a product and print option,</text>
      <text x="34" y="683" font-size="13" fill="#9CA3AF">enter at least 1,040, then pay.</text>
    </g>
    <path d="M210 708v22m-7-8 7 8 7-8" fill="none" stroke="#CC710B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="16" y="736" width="388" height="150" rx="18" fill="#1A1B22" stroke="#33271D" stroke-width="2"/>
      <circle cx="48" cy="770" r="20" fill="#CC710B"/>
      <text x="48" y="776" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
      <text x="80" y="768" font-size="12" font-weight="700" fill="#E68817">ANALYTICS</text>
      <text x="34" y="814" font-size="19" font-weight="700" fill="#FFFFFF">Track Distribution</text>
      <text x="34" y="842" font-size="13" fill="#9CA3AF">See the overview on Home and</text>
      <text x="34" y="863" font-size="13" fill="#9CA3AF">details in the Analytics menu.</text>
    </g>
  </g>
</svg>
