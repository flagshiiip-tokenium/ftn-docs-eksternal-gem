<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" width="100%" height="100%" role="img" aria-label="Mekanisme anti-duplikasi stiker unik (versi ponsel)">
  <defs>
    <linearGradient id="bgGradMob5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#14151A" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="cardGradMob5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1B22" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#111217" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGradMob5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="successCardMob5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E291F" />
      <stop offset="100%" stop-color="#081410" />
    </linearGradient>
    <linearGradient id="warningCardMob5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1417" />
      <stop offset="100%" stop-color="#140B0C" />
    </linearGradient>
    <filter id="shadowGlowMob5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="dotGlowMob5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
    <filter id="successGlowMob5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
    <filter id="warningGlowMob5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="416" height="796" rx="20" fill="url(#bgGradMob5)" stroke="#26211A" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#CC710B" filter="url(#dotGlowMob5)" />
    <text x="22" y="15.5" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#E68817" letter-spacing="0.8">ANTI-DUPLIKASI</text>
    <text x="190" y="16.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#9CA3AF">1 Stiker = 1 Kali Klaim</text>
  </g>

  <!-- ==================== TOP CARD: SMART STICKER ==================== -->
  <g transform="translate(20, 56)">
    <rect x="0" y="0" width="380" height="150" rx="16" fill="url(#cardGradMob5)" stroke="#CC710B" stroke-width="1.8" filter="url(#shadowGlowMob5)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob5)" />

    <!-- Sticker Illustration -->
    <g transform="translate(68, 70)">
      <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#1C1813" stroke="#CC710B" stroke-width="1.8" />
      <rect x="-25" y="-25" width="50" height="50" rx="5" fill="#FFFFFF" />
      <!-- Mini QR Finder Patterns -->
      <rect x="-20" y="-20" width="12" height="12" fill="#111827" />
      <rect x="-18" y="-18" width="8" height="8" fill="#FFFFFF" />
      <rect x="-16" y="-16" width="4" height="4" fill="#111827" />
      <rect x="8" y="-20" width="12" height="12" fill="#111827" />
      <rect x="10" y="-18" width="8" height="8" fill="#FFFFFF" />
      <rect x="12" y="-16" width="4" height="4" fill="#111827" />
      <rect x="-20" y="8" width="12" height="12" fill="#111827" />
      <rect x="-18" y="10" width="8" height="8" fill="#FFFFFF" />
      <rect x="-16" y="12" width="4" height="4" fill="#111827" />
      <polygon points="0,-4 5,0 0,4 -5,0" fill="#CC710B" />
      <!-- Serial badge -->
      <rect x="-26" y="34" width="52" height="12" rx="3" fill="#261E14" stroke="#CC710B" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="0" y="42.5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="700" fill="#F59E0B">#FLG-9924</text>
    </g>

    <!-- Info -->
    <g transform="translate(125, 30)">
      <rect x="0" y="0" width="125" height="18" rx="9" fill="#CC710B" fill-opacity="0.15" stroke="#CC710B" stroke-opacity="0.4" stroke-width="1" />
      <text x="62.5" y="12.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#E68817">SEAL SEKALI PAKAI</text>

      <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1 Stiker = 1 Kode Unik</text>
      <text x="0" y="66" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Kriptografi acak sekali pakai.</text>
      <text x="0" y="86" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF">Tidak ada 2 stiker yang sama.</text>
    </g>
  </g>

  <!-- Arrow down to Scan 1 -->
  <g transform="translate(210, 214)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#10B981" stroke-width="2.5" />
    <polygon points="0,22 -4,14 4,14" fill="#10B981" />
    <circle cx="0" cy="8" r="2.5" fill="#34D399" />
  </g>

  <!-- ==================== CARD 1: SCAN KE-1 (BERHASIL) ==================== -->
  <g transform="translate(20, 244)">
    <rect x="0" y="0" width="380" height="236" rx="16" fill="url(#successCardMob5)" stroke="#10B981" stroke-width="1.8" filter="url(#successGlowMob5)" />
    
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <path d="M16 6 L25 10 V17 C25 24 16 28 16 28 C16 28 7 24 7 17 V10 Z" fill="#047857" />
      <path d="M12 17 L15 20 L21 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="42" y="6" width="165" height="20" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="124" y="19.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34D399">SCAN KE-1: TERVERIFIKASI</text>
    </g>

    <text x="20" y="78" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Klaim Sah &amp; Sertifikat Terbit</text>

    <!-- Bullets -->
    <g transform="translate(20, 94)">
      <circle cx="5" cy="10" r="3" fill="#34D399" />
      <text x="16" y="14" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#D1FAE5">Pembeli pertama membuktikan produk</text>
      <text x="16" y="32" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#D1FAE5">asli 100% dan resmi dari brand.</text>

      <circle cx="5" cy="54" r="3" fill="#34D399" />
      <text x="16" y="58" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#D1FAE5">Sertifikat kepemilikan dan hadiah token</text>
      <text x="16" y="76" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#D1FAE5">FTN langsung aktif ke dompet digital.</text>

      <circle cx="5" cy="98" r="3" fill="#34D399" />
      <text x="16" y="102" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34D399">Status stiker otomatis terkunci CLAIMED.</text>
    </g>
  </g>

  <!-- Arrow down to Scan 2 -->
  <g transform="translate(210, 488)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#EF4444" stroke-width="2.5" />
    <polygon points="0,22 -4,14 4,14" fill="#EF4444" />
    <circle cx="0" cy="8" r="2.5" fill="#F87171" />
  </g>

  <!-- ==================== CARD 2: SCAN KE-2 (DUPLIKASI) ==================== -->
  <g transform="translate(20, 518)">
    <rect x="0" y="0" width="380" height="246" rx="16" fill="url(#warningCardMob5)" stroke="#EF4444" stroke-width="1.8" filter="url(#warningGlowMob5)" />
    
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
      <circle cx="16" cy="16" r="10" fill="none" stroke="#EF4444" stroke-width="2" />
      <line x1="9" y1="9" x2="23" y2="23" stroke="#EF4444" stroke-width="2" />
      <text x="16" y="20.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">!</text>

      <rect x="42" y="6" width="195" height="20" rx="10" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
      <text x="139.5" y="19.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#F87171">SCAN KE-2+: DUPLIKASI BLOKIR</text>
    </g>

    <text x="20" y="78" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Stiker Sudah Pernah Diklaim!</text>

    <!-- Bullets -->
    <g transform="translate(20, 94)">
      <circle cx="5" cy="10" r="3" fill="#F87171" />
      <text x="16" y="14" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#FEE2E2">Jika stiker difotokopi atau ditempel ulang,</text>
      <text x="16" y="32" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#FEE2E2">sistem mutlak menolak klaim kedua.</text>

      <circle cx="5" cy="54" r="3" fill="#F87171" />
      <text x="16" y="58" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#FEE2E2">Aplikasi memperlihatkan waktu &amp; tanggal</text>
      <text x="16" y="76" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#FEE2E2">kapan kode pertama kali diverifikasi.</text>

      <circle cx="5" cy="98" r="3" fill="#F87171" />
      <text x="16" y="102" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F87171">Melindungi pembeli dari barang tiruan!</text>
    </g>
  </g>
</svg>
