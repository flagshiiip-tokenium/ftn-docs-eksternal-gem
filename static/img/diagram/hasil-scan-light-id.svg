<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" role="img" aria-label="Hasil scan: terverifikasi atau tidak terverifikasi">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f9fafb" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="successCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="warningCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261214" />
      <stop offset="100%" stop-color="#140B0C" />
    </linearGradient>
    <linearGradient id="emeraldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadowGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="dotGlow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
    <filter id="successGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
    <filter id="warningGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#EF4444" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="356" rx="20" fill="url(#bgGrad3)" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(30, 22)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#dotGlow3)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="1">LOGIKA PEMINDAIAN SISTEM</text>
    <text x="235" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6b7280">Dua kemungkinan respon saat stiker QR dipindai kamera ponsel</text>
  </g>

  <!-- ==================== LEFT NODE: SCANNER ==================== -->
  <g transform="translate(25, 62)">
    <rect x="0" y="0" width="250" height="276" rx="16" fill="url(#cardGrad3)" stroke="#CC710B" stroke-width="1.8" filter="url(#shadowGlow3)" />
    <rect x="1" y="1" width="248" height="3" rx="1.5" fill="url(#amberGrad3)" />

    <!-- Scanner Illustration -->
    <g transform="translate(125, 95)">
      <!-- Phone Graphic -->
      <rect x="-32" y="-48" width="64" height="106" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2" />
      <rect x="-26" y="-40" width="52" height="90" rx="8" fill="#15171C" />
      <rect x="-8" y="-44" width="16" height="3.5" rx="1.7" fill="#374151" />

      <!-- QR in Camera Lens -->
      <rect x="-18" y="-20" width="36" height="36" rx="4" fill="#FFFFFF" />
      <rect x="-14" y="-16" width="10" height="10" fill="#111827" />
      <rect x="-12" y="-14" width="6" height="6" fill="#FFFFFF" />
      <rect x="4" y="-16" width="10" height="10" fill="#111827" />
      <rect x="6" y="-14" width="6" height="6" fill="#FFFFFF" />
      <rect x="-14" y="2" width="10" height="10" fill="#111827" />
      <rect x="-12" y="4" width="6" height="6" fill="#FFFFFF" />
      <rect x="2" y="2" width="6" height="6" fill="#CC710B" />

      <!-- Scanning Beam Effect -->
      <line x1="-24" y1="-2" x2="24" y2="-2" stroke="#CC710B" stroke-width="2.5" />
      <polygon points="-24,-2 24,-2 18,-16 -18,-16" fill="#CC710B" fill-opacity="0.3" />
      <polygon points="-24,-2 24,-2 18,12 -18,12" fill="#CC710B" fill-opacity="0.15" />
    </g>

    <!-- Scanner Info -->
    <text x="125" y="180" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Scan Stiker QR</text>
    <text x="125" y="202" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Kamera membaca kode unik</text>
    <text x="125" y="220" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">pada stiker fisik Flagshiiip</text>

    <!-- Status Tag -->
    <rect x="45" y="236" width="160" height="22" rx="11" fill="#CC710B" fill-opacity="0.15" stroke="#CC710B" stroke-opacity="0.4" stroke-width="1" />
    <text x="125" y="251" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#8f4f08">VERIFIKASI REAL-TIME</text>
  </g>

  <!-- ==================== CONNECTING BRANCHES ==================== -->
  <!-- Upper Branch (Green) -->
  <path d="M 275 160 C 320 160, 320 120, 360 120" fill="none" stroke="#10B981" stroke-width="2.5" />
  <polygon points="364,120 354,115 354,125" fill="#10B981" />
  <circle cx="318" cy="140" r="3.5" fill="#10B981" filter="url(#successGlow)" />

  <!-- Lower Branch (Red) -->
  <path d="M 275 240 C 320 240, 320 280, 360 280" fill="none" stroke="#EF4444" stroke-width="2.5" />
  <polygon points="364,280 354,275 354,285" fill="#EF4444" />
  <circle cx="318" cy="260" r="3.5" fill="#EF4444" filter="url(#warningGlow)" />

  <!-- ==================== UPPER CARD: TERVERIFIKASI ==================== -->
  <g transform="translate(365, 62)">
    <rect x="0" y="0" width="570" height="132" rx="16" fill="url(#successCard)" stroke="#10B981" stroke-width="1.8" filter="url(#successGlow)" />
    
    <!-- Shield Icon -->
    <g transform="translate(42, 66)">
      <circle cx="0" cy="0" r="28" fill="#d1fae5" stroke="#10B981" stroke-width="2" />
      <path d="M0 -18 L16 -10 V2 C16 14 0 21 0 21 C0 21 -16 14 -16 2 V-10 Z" fill="#047857" />
      <path d="M-6 2 L-1 7 L8 -2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Card Content -->
    <g transform="translate(85, 24)">
      <!-- Badge -->
      <rect x="0" y="0" width="150" height="20" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="75" y="14" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">✓ 100% TERVERIFIKASI ASLI</text>

      <!-- Title -->
      <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Produk Terbukti Asli &amp; Resmi</text>

      <!-- Bullet Points -->
      <g transform="translate(0, 58)">
        <text x="0" y="6" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#166534">• Sertifikat kepemilikan digital resmi tercatat di blockchain Polygon.</text>
        <text x="0" y="24" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#166534">• Kemasan pertama kali dibuka, data produsen &amp; nomor batch tervalidasi.</text>
        <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#047857">• Anda berhak mengklaim hadiah token loyalitas FTN (jika tersedia).</text>
      </g>
    </g>
  </g>

  <!-- ==================== LOWER CARD: TIDAK TERVERIFIKASI ==================== -->
  <g transform="translate(365, 206)">
    <rect x="0" y="0" width="570" height="132" rx="16" fill="url(#warningCard)" stroke="#EF4444" stroke-width="1.8" filter="url(#warningGlow)" />
    
    <!-- Warning Icon -->
    <g transform="translate(42, 66)">
      <circle cx="0" cy="0" r="28" fill="#450A0A" stroke="#EF4444" stroke-width="2" />
      <polygon points="0,-18 18,14 -18,14" fill="#B91C1C" />
      <line x1="0" y1="-8" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="9" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Card Content -->
    <g transform="translate(85, 24)">
      <!-- Badge -->
      <rect x="0" y="0" width="190" height="20" rx="10" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
      <text x="95" y="14" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">⚠ PERINGATAN / TIDAK VALID</text>

      <!-- Title -->
      <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Kode Tidak Dikenali atau Sudah Pernah Diklaim</text>

      <!-- Bullet Points -->
      <g transform="translate(0, 58)">
        <text x="0" y="6" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#991b1b">• QR tidak terdaftar di sistem atau stiker telah dipindai orang lain sebelumnya.</text>
        <text x="0" y="24" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#991b1b">• Indikasi barang palsu, tiruan, atau daur ulang kemasan tanpa izin resmi.</text>
        <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">• Segera hubungi pihak penjual atau adukan langsung ke brand terkait.</text>
      </g>
    </g>
  </g>
</svg>