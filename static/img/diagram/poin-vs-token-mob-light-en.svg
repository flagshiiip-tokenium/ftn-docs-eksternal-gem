<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 690" width="100%" height="100%" role="img" aria-label="Comparison of regular loyalty points with Flagshiiip token (mobile version)">
  <defs>
    <linearGradient id="bgGradMob7En" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="cardGradLegacyMob7En" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="cardGradFTNMob7En" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="amberGradMob7En" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoinMob7En" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadowGlowMob7En" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="vsGlowMob7En" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="416" height="686" rx="20" fill="url(#bgGradMob7En)" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#CC710B" filter="url(#vsGlowMob7En)" />
    <text x="22" y="15.5" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#8f4f08" letter-spacing="0.8">VALUE COMPARISON</text>
    <text x="190" y="16.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6b7280">Points vs FTN Token</text>
  </g>

  <!-- ==================== TOP CARD: TRADITIONAL POINTS ==================== -->
  <g transform="translate(20, 56)">
    <rect x="0" y="0" width="380" height="240" rx="16" fill="url(#cardGradLegacyMob7En)" stroke="#3E3436" stroke-width="1.5" filter="url(#shadowGlowMob7En)" />

    <!-- Header Row -->
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#2E2527" stroke="#6B5B5E" stroke-width="1.2" />
      <line x1="10" y1="16" x2="22" y2="16" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" />

      <rect x="42" y="6" width="120" height="20" rx="10" fill="#3D2B2E" stroke="#713F45" stroke-width="1" />
      <text x="102" y="19.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">CLOSED SYSTEM</text>
    </g>

    <text x="20" y="76" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#D1D5DB">Traditional Loyalty Points</text>

    <!-- Comparison Rows -->
    <g transform="translate(20, 92)">
      <!-- Row 1 -->
      <circle cx="8" cy="9" r="8" fill="#fef2f2" />
      <path d="M5 6 L11 12 M11 6 L5 12" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" />
      <text x="24" y="13" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#E5E7EB">Locked in a Single Store / App</text>
      <text x="24" y="29" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Stored in closed servers, non-transferable.</text>

      <!-- Row 2 -->
      <g transform="translate(0, 46)">
        <circle cx="8" cy="9" r="8" fill="#fef2f2" />
        <path d="M5 6 L11 12 M11 6 L5 12" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" />
        <text x="24" y="13" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#E5E7EB">Subject to Expiration Dates</text>
        <text x="24" y="29" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Points frequently expire if not quickly used.</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 92)">
        <circle cx="8" cy="9" r="8" fill="#fef2f2" />
        <path d="M5 6 L11 12 M11 6 L5 12" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" />
        <text x="24" y="13" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#E5E7EB">Not an Asset You Truly Own</text>
        <text x="24" y="29" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Rules can be altered unilaterally by the store.</text>
      </g>
    </g>
  </g>

  <!-- ==================== CENTER VS BADGE ==================== -->
  <g transform="translate(210, 312)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#CC710B" stroke-width="2" filter="url(#vsGlowMob7En)" />
    <text x="0" y="5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#8f4f08">VS</text>
  </g>

  <!-- ==================== BOTTOM CARD: FLAGSHIIIP TOKEN (FTN) ==================== -->
  <g transform="translate(20, 332)">
    <rect x="0" y="0" width="380" height="246" rx="16" fill="url(#cardGradFTNMob7En)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlowMob7En)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob7En)" />

    <!-- Header Row -->
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="url(#goldCoinMob7En)" stroke="#92400E" stroke-width="1.2" filter="url(#vsGlowMob7En)" />
      <polygon points="16,8 22,15 16,24 10,15" fill="#FFFFFF" fill-opacity="0.9" />

      <rect x="42" y="6" width="160" height="20" rx="10" fill="#CC710B" fill-opacity="0.2" stroke="#CC710B" stroke-width="1" />
      <text x="122" y="19.5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#8f4f08">BLOCKCHAIN DIGITAL ASSET</text>
    </g>

    <text x="20" y="76" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Flagshiiip Token (FTN)</text>

    <!-- Comparison Rows -->
    <g transform="translate(20, 92)">
      <!-- Row 1 -->
      <circle cx="8" cy="9" r="8" fill="#dcfce7" />
      <path d="M5 9 L7.5 12 L12 6" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="24" y="13" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">Stored in Your Personal Web3 Wallet</text>
      <text x="24" y="29" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Held securely in private wallet, full control is yours.</text>

      <!-- Row 2 -->
      <g transform="translate(0, 46)">
        <circle cx="8" cy="9" r="8" fill="#dcfce7" />
        <path d="M5 9 L7.5 12 L12 6" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="24" y="13" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">Permanent Ownership Without Expiry</text>
        <text x="24" y="29" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Tokens never expire; permanent personal property.</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 92)">
        <circle cx="8" cy="9" r="8" fill="#dcfce7" />
        <path d="M5 9 L7.5 12 L12 6" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="24" y="13" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">Real Digital Asset with Liquid Utility</text>
        <text x="24" y="29" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">Recorded on public Polygon blockchain transparently.</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTNOTE TAGLINE ==================== -->
  <g transform="translate(20, 594)">
    <rect x="0" y="0" width="380" height="74" rx="12" fill="#ffffff" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <text x="190" y="28" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#8f4f08">Where Loyalty Becomes an Asset</text>
    <text x="190" y="50" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6b7280">Transforming shopping loyalty into genuine digital assets.</text>
  </g>
</svg>
