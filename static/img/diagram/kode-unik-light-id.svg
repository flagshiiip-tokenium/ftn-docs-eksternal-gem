<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" role="img" aria-label="Setiap stiker punya kode unik yang hanya bisa diklaim sekali">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#f9fafb" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="successCard5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="warningCard5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261214" />
      <stop offset="100%" stop-color="#140B0C" />
    </linearGradient>
    <filter id="shadowGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="dotGlow5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
    <filter id="successGlow5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
    <filter id="warningGlow5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#EF4444" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="356" rx="20" fill="url(#bgGrad5)" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Header Badge -->
  <g transform="translate(30, 22)">
    <rect x="0" y="0" width="225" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#dotGlow5)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="1">MEKANISME ANTI-DUPLIKASI</text>
    <text x="240" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6b7280">Satu stiker ber-QR unik kriptografis hanya dapat diklaim 1 kali</text>
  </g>

  <!-- ==================== LEFT NODE: SMART STICKER ==================== -->
  <g transform="translate(25, 62)">
    <rect x="0" y="0" width="260" height="276" rx="16" fill="url(#cardGrad5)" stroke="#CC710B" stroke-width="1.8" filter="url(#shadowGlow5)" />
    <rect x="1" y="1" width="258" height="3" rx="1.5" fill="url(#amberGrad5)" />

    <!-- Smart Physical Sticker Illustration -->
    <g transform="translate(130, 92)">
      <!-- Hologram Outer Border -->
      <rect x="-42" y="-42" width="84" height="84" rx="10" fill="#ffffff" stroke="#CC710B" stroke-width="2" />
      <rect x="-36" y="-36" width="72" height="72" rx="7" fill="#FFFFFF" />

      <!-- QR Code Structure -->
      <g transform="translate(-28, -28)">
        <!-- Top-Left Finder -->
        <rect x="0" y="0" width="16" height="16" fill="#111827" />
        <rect x="3" y="3" width="10" height="10" fill="#FFFFFF" />
        <rect x="5.5" y="5.5" width="5" height="5" fill="#111827" />
        <!-- Top-Right Finder -->
        <rect x="40" y="0" width="16" height="16" fill="#111827" />
        <rect x="43" y="3" width="10" height="10" fill="#FFFFFF" />
        <rect x="45.5" y="5.5" width="5" height="5" fill="#111827" />
        <!-- Bottom-Left Finder -->
        <rect x="0" y="40" width="16" height="16" fill="#111827" />
        <rect x="3" y="43" width="10" height="10" fill="#FFFFFF" />
        <rect x="5.5" y="45.5" width="5" height="5" fill="#111827" />
        <!-- Flagshiiip Diamond Center Accent -->
        <polygon points="28,21 35,28 28,35 21,28" fill="#CC710B" />
        <!-- Micro dots -->
        <rect x="20" y="4" width="4" height="4" fill="#111827" />
        <rect x="30" y="8" width="4" height="4" fill="#111827" />
        <rect x="4" y="24" width="4" height="4" fill="#111827" />
        <rect x="48" y="24" width="4" height="4" fill="#111827" />
        <rect x="20" y="46" width="4" height="4" fill="#111827" />
        <rect x="38" y="44" width="4" height="4" fill="#111827" />
      </g>

      <!-- Serial Number Tag below sticker -->
      <rect x="-38" y="46" width="76" height="14" rx="4" fill="#261E14" stroke="#CC710B" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="56" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#8f4f08">#FLG-9924-ID</text>
    </g>

    <!-- Info -->
    <text x="130" y="180" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">1 Stiker = 1 Kode Unik</text>
    <text x="130" y="202" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Kriptografi sekali pakai acak.</text>
    <text x="130" y="220" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Tidak ada 2 stiker yang sama.</text>

    <!-- Chip -->
    <rect x="50" y="236" width="160" height="22" rx="11" fill="#CC710B" fill-opacity="0.15" stroke="#CC710B" stroke-opacity="0.4" stroke-width="1" />
    <text x="130" y="251" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#8f4f08">SEAL SEKALI PAKAI</text>
  </g>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- Top Branch (First scan success) -->
  <path d="M 285 155 C 330 155, 330 120, 365 120" fill="none" stroke="#10B981" stroke-width="2.5" />
  <polygon points="369,120 359,115 359,125" fill="#10B981" />
  <circle cx="325" cy="138" r="3.5" fill="#10B981" filter="url(#successGlow5)" />

  <!-- Bottom Branch (Second scan detected) -->
  <path d="M 285 245 C 330 245, 330 280, 365 280" fill="none" stroke="#EF4444" stroke-width="2.5" />
  <polygon points="369,280 359,275 359,285" fill="#EF4444" />
  <circle cx="325" cy="262" r="3.5" fill="#EF4444" filter="url(#warningGlow5)" />

  <!-- ==================== UPPER CARD: SCAN KE-1 (BERHASIL) ==================== -->
  <g transform="translate(370, 62)">
    <rect x="0" y="0" width="565" height="132" rx="16" fill="url(#successCard5)" stroke="#10B981" stroke-width="1.8" filter="url(#successGlow5)" />
    
    <!-- Icon -->
    <g transform="translate(42, 66)">
      <circle cx="0" cy="0" r="28" fill="#d1fae5" stroke="#10B981" stroke-width="2" />
      <path d="M0 -18 L16 -10 V2 C16 14 0 21 0 21 C0 21 -16 14 -16 2 V-10 Z" fill="#047857" />
      <path d="M-6 2 L-1 7 L8 -2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Content -->
    <g transform="translate(85, 24)">
      <rect x="0" y="0" width="165" height="20" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="82" y="14" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857">SCAN KE-1: TERVERIFIKASI</text>

      <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Klaim Sah &amp; Sertifikat Digital Terbit</text>

      <g transform="translate(0, 58)">
        <text x="0" y="6" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#166534">• Pembeli pertama berhasil membuktikan produk asli 100%.</text>
        <text x="0" y="24" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#166534">• Sertifikat kepemilikan dan hadiah token FTN langsung aktif di akun.</text>
        <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#047857">• Status stiker otomatis terkunci menjadi "CLAIMED" di blockchain.</text>
      </g>
    </g>
  </g>

  <!-- ==================== LOWER CARD: SCAN KE-2 (DUPLIKASI) ==================== -->
  <g transform="translate(370, 206)">
    <rect x="0" y="0" width="565" height="132" rx="16" fill="url(#warningCard5)" stroke="#EF4444" stroke-width="1.8" filter="url(#warningGlow5)" />
    
    <!-- Icon -->
    <g transform="translate(42, 66)">
      <circle cx="0" cy="0" r="28" fill="#450A0A" stroke="#EF4444" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#EF4444" stroke-width="2.5" />
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#EF4444" stroke-width="2.5" />
      <text x="0" y="6" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#111827">!</text>
    </g>

    <!-- Content -->
    <g transform="translate(85, 24)">
      <rect x="0" y="0" width="195" height="20" rx="10" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
      <text x="97" y="14" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">SCAN KE-2+: DUPLIKASI BLOKIR</text>

      <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Peringatan: Stiker Sudah Pernah Diklaim!</text>

      <g transform="translate(0, 58)">
        <text x="0" y="6" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#991b1b">• Jika stiker difotokopi atau ditempel ulang, sistem menolak klaim kedua.</text>
        <text x="0" y="24" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#991b1b">• Aplikasi menampilkan riwayat waktu &amp; tanggal kapan kode pertama kali dipakai.</text>
        <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">• Melindungi pembeli secara mutlak dari produk tiruan atau stiker bekas.</text>
      </g>
    </g>
  </g>
</svg>