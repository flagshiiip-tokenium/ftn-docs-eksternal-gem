<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="100%" height="100%" role="img" aria-label="Gambaran umum Flagshiiip dalam tiga langkah (versi ponsel)">
  <defs>
    <linearGradient id="bgGradMob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="cardGradMob1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#f9fafb" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="amberGradMob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoinMob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="emeraldGradMob1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowGlowMob1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="dotGlowMob1" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="416" height="776" rx="20" fill="url(#bgGradMob1)" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- Top Header Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#CC710B" filter="url(#dotGlowMob1)" />
    <text x="22" y="15.5" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#8f4f08" letter-spacing="0.8">ALUR EKOSISTEM</text>
    <text x="190" y="16.5" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6b7280">3 Langkah Flagshiiip</text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(20, 58)">
    <rect x="0" y="0" width="380" height="206" rx="16" fill="url(#cardGradMob1)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlowMob1)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob1)" />

    <!-- Step Badge -->
    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#amberGradMob1)" />
    <text x="30" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">1</text>
    <text x="52" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="0.5">PRODUSEN / BRAND</text>

    <!-- Visual: 3D Box with QR -->
    <g transform="translate(70, 115)">
      <polygon points="0,-28 38,-12 0,4 -38,-12" fill="#3D2613" stroke="#5C3A1D" stroke-width="1" />
      <polygon points="-38,-12 0,4 0,38 -38,22" fill="#29180B" stroke="#42250E" stroke-width="1" />
      <polygon points="0,4 38,-12 38,22 0,38" fill="#1C1007" stroke="#331C0B" stroke-width="1" />
      <g transform="translate(-28, -2) skewY(22) scale(0.55)">
        <rect x="0" y="0" width="36" height="36" rx="4" fill="#FFFFFF" stroke="#CC710B" stroke-width="2" />
        <rect x="4" y="4" width="10" height="10" fill="#111827" />
        <rect x="22" y="4" width="10" height="10" fill="#111827" />
        <rect x="4" y="22" width="10" height="10" fill="#111827" />
        <rect x="18" y="18" width="5" height="5" fill="#CC710B" />
      </g>
      <circle cx="-18" cy="8" r="14" fill="#CC710B" fill-opacity="0.25" filter="url(#dotGlowMob1)" />
    </g>

    <!-- Content -->
    <g transform="translate(135, 75)">
      <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Brand Pasang Stiker</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Stiker QR pintar kriptografis</text>
      <text x="0" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">ditempel pada kemasan resmi saat</text>
      <text x="0" y="84" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">proses produksi berlangsung.</text>
    </g>
  </g>

  <!-- Downward Arrow 1 -> 2 -->
  <g transform="translate(210, 274)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="0,24 -4,15 4,15" fill="#CC710B" />
    <circle cx="0" cy="9" r="2.5" fill="#F59E0B" filter="url(#dotGlowMob1)" />
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(20, 298)">
    <rect x="0" y="0" width="380" height="206" rx="16" fill="url(#cardGradMob1)" stroke="#e5e7eb" stroke-width="1.5" filter="url(#shadowGlowMob1)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob1)" />

    <!-- Step Badge -->
    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#amberGradMob1)" />
    <text x="30" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">2</text>
    <text x="52" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="0.5">DISTRIBUSI &amp; RETAIL</text>

    <!-- Visual: Bag with Shield -->
    <g transform="translate(70, 115)">
      <rect x="-24" y="-14" width="48" height="42" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
      <path d="M-11 -14 C -11 -25, 11 -25, 11 -14" fill="none" stroke="#CC710B" stroke-width="2" stroke-linecap="round" />
      <g transform="translate(0, 8)">
        <path d="M0 -15 L14 -9 V3 C14 12 0 18 0 18 C0 18 -14 12 -14 3 V-9 Z" fill="#121816" stroke="url(#emeraldGradMob1)" stroke-width="1.8" />
        <path d="M-5 2 L-1 6 L6 -2" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(135, 75)">
      <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Produk Sampai ke Anda</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Anda membeli produk original</text>
      <text x="0" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">di toko offline resmi maupun toko</text>
      <text x="0" y="84" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">daring (online marketplace).</text>
    </g>
  </g>

  <!-- Downward Arrow 2 -> 3 -->
  <g transform="translate(210, 514)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#CC710B" stroke-width="2.5" stroke-dasharray="3 3" />
    <polygon points="0,24 -4,15 4,15" fill="#CC710B" />
    <circle cx="0" cy="9" r="2.5" fill="#F59E0B" filter="url(#dotGlowMob1)" />
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(20, 538)">
    <rect x="0" y="0" width="380" height="216" rx="16" fill="url(#cardGradMob1)" stroke="#CC710B" stroke-width="2" filter="url(#shadowGlowMob1)" />
    <rect x="1" y="1" width="378" height="3" rx="1.5" fill="url(#amberGradMob1)" />

    <!-- Step Badge -->
    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#amberGradMob1)" />
    <text x="30" y="33" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#111827">3</text>
    <text x="52" y="32" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#8f4f08" letter-spacing="0.5">KONSUMEN / PEMBELI</text>

    <!-- Visual: Phone & FTN Coin -->
    <g transform="translate(68, 120)">
      <rect x="-18" y="-28" width="36" height="58" rx="7" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
      <rect x="-14" y="-23" width="28" height="48" rx="5" fill="#14181B" />
      <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#CC710B" stroke-width="1.8" />
      <circle cx="0" cy="10" r="8" fill="#10B981" />
      <path d="M-3 10 L-1 12 L4 7" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <g transform="translate(24, -12)">
        <circle cx="0" cy="0" r="11" fill="url(#goldCoinMob1)" stroke="#92400E" stroke-width="1.2" filter="url(#dotGlowMob1)" />
        <polygon points="0,-6 4,-1 0,6 -4,-1" fill="#FFFFFF" fill-opacity="0.9" />
      </g>
    </g>

    <!-- Content -->
    <g transform="translate(135, 75)">
      <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Anda Scan &amp; Verifikasi</text>
      <text x="0" y="44" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">Aplikasi membuktikan keaslian,</text>
      <text x="0" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">menerbitkan sertifikat kepemilikan,</text>
      <text x="0" y="84" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280">&amp; memberikan hadiah token FTN.</text>
    </g>
  </g>
</svg>
