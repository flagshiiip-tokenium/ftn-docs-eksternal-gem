<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" role="img" aria-label="Perbandingan poin loyalitas biasa dengan token Flagshiiip">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="50%" stop-color="#14151A" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="cardGradLegacy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A181A" />
      <stop offset="100%" stop-color="#121113" />
    </linearGradient>
    <linearGradient id="cardGradFTN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24190F" />
      <stop offset="100%" stop-color="#140E08" />
    </linearGradient>
    <linearGradient id="amberGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#CC710B" />
      <stop offset="100%" stop-color="#9A4E04" />
    </linearGradient>
    <linearGradient id="goldCoin7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadowGlow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="ftnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#CC710B" flood-opacity="0.3" />
    </filter>
    <filter id="vsGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#CC710B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="356" rx="20" fill="url(#bgGrad7)" stroke="#26211A" stroke-width="1.5" />

  <!-- Top Header Badge -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="225" height="26" rx="13" fill="#CC710B" fill-opacity="0.12" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#CC710B" filter="url(#vsGlow)" />
    <text x="26" y="17" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E68817" letter-spacing="1">ANALISIS PERBANDINGAN</text>
    <text x="240" y="18" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF">Mengapa token digital FTN jauh lebih bernilai dibanding poin konvensional</text>
  </g>

  <!-- ==================== LEFT CARD: POIN BIASA ==================== -->
  <g transform="translate(25, 58)">
    <rect x="0" y="0" width="430" height="248" rx="16" fill="url(#cardGradLegacy)" stroke="#3E3436" stroke-width="1.5" filter="url(#shadowGlow7)" />
    
    <!-- Header -->
    <g transform="translate(20, 20)">
      <!-- Muted Database Icon with Padlock -->
      <g transform="translate(18, 16)">
        <ellipse cx="0" cy="-12" rx="16" ry="6" fill="#2E2527" stroke="#6B5B5E" stroke-width="1.5" />
        <path d="M-16 -12 V-2 C-16 2 0 6 0 6 C0 6 16 2 16 -2 V-12" fill="none" stroke="#6B5B5E" stroke-width="1.5" />
        <path d="M-16 -2 V8 C-16 12 0 16 0 16 C0 16 16 12 16 8 V-2" fill="none" stroke="#6B5B5E" stroke-width="1.5" />
        <circle cx="12" cy="10" r="7" fill="#DC2626" />
        <line x1="9" y1="10" x2="15" y2="10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <rect x="46" y="4" width="130" height="18" rx="9" fill="#3D2B2E" stroke="#713F45" stroke-width="1" />
      <text x="111" y="16" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#F87171">SISTEM TERTUTUP</text>
      <text x="46" y="40" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#D1D5DB">Poin Loyalitas Biasa</text>
    </g>

    <!-- Comparison Rows -->
    <g transform="translate(20, 84)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#2D1B1E" />
        <path d="M7 7 L13 13 M13 7 L7 13" stroke="#F87171" stroke-width="2" stroke-linecap="round" />
        <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">Tersimpan di 1 Toko / Aplikasi Tertentu</text>
        <text x="28" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF">Terkunci di server internal toko, tidak dapat dipindahkan.</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <circle cx="10" cy="10" r="10" fill="#2D1B1E" />
        <path d="M7 7 L13 13 M13 7 L7 13" stroke="#F87171" stroke-width="2" stroke-linecap="round" />
        <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">Masa Berlaku Terbatas (Bisa Hangus)</text>
        <text x="28" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF">Sering kedaluwarsa sepihak jika tidak cepat digunakan.</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 96)">
        <circle cx="10" cy="10" r="10" fill="#2D1B1E" />
        <path d="M7 7 L13 13 M13 7 L7 13" stroke="#F87171" stroke-width="2" stroke-linecap="round" />
        <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#E5E7EB">Bukan Aset Milik Anda</text>
        <text x="28" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF">Nilai &amp; aturan dapat dibatalkan atau diubah sepihak oleh toko.</text>
      </g>
    </g>
  </g>

  <!-- ==================== CENTER VS BADGE ==================== -->
  <g transform="translate(480, 182)">
    <circle cx="0" cy="0" r="22" fill="#1C1813" stroke="#CC710B" stroke-width="2.5" filter="url(#vsGlow)" />
    <text x="0" y="6" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#F59E0B">VS</text>
  </g>

  <!-- ==================== RIGHT CARD: TOKEN FLAGSHIIIP (FTN) ==================== -->
  <g transform="translate(505, 58)">
    <rect x="0" y="0" width="430" height="248" rx="16" fill="url(#cardGradFTN)" stroke="#CC710B" stroke-width="2" filter="url(#ftnGlow)" />
    <rect x="1" y="1" width="428" height="3" rx="1.5" fill="url(#amberGrad7)" />

    <!-- Header -->
    <g transform="translate(20, 20)">
      <!-- Golden FTN Coin Graphic -->
      <g transform="translate(18, 16)">
        <circle cx="0" cy="0" r="16" fill="url(#goldCoin7)" stroke="#92400E" stroke-width="1.5" filter="url(#vsGlow)" />
        <polygon points="0,-8 6,-1 0,8 -6,-1" fill="#FFFFFF" fill-opacity="0.9" />
      </g>
      <rect x="46" y="4" width="160" height="18" rx="9" fill="#CC710B" fill-opacity="0.2" stroke="#CC710B" stroke-width="1" />
      <text x="126" y="16" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#F59E0B">ASET DIGITAL BLOCKCHAIN</text>
      <text x="46" y="40" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Token Flagshiiip (FTN)</text>
    </g>

    <!-- Comparison Rows -->
    <g transform="translate(20, 84)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#0D2E1F" />
        <path d="M6 10 L9 13 L15 7" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Tersimpan di Dompet Digital Pribadi</text>
        <text x="28" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF">Tersimpan di Web3 wallet Anda, kontrol penuh di tangan Anda.</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <circle cx="10" cy="10" r="10" fill="#0D2E1F" />
        <path d="M6 10 L9 13 L15 7" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Permanen Tanpa Batas Kedaluwarsa</text>
        <text x="28" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF">Tidak akan pernah hangus, selamanya menjadi hak milik Anda.</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 96)">
        <circle cx="10" cy="10" r="10" fill="#0D2E1F" />
        <path d="M6 10 L9 13 L15 7" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="28" y="14" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Aset Digital Riil &amp; Fleksibel</text>
        <text x="28" y="30" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#9CA3AF">Tercatat di blockchain publik Polygon, bernilai riil &amp; transparan.</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTNOTE TAGLINE ==================== -->
  <g transform="translate(25, 316)">
    <rect x="0" y="0" width="910" height="32" rx="8" fill="#15120D" stroke="#CC710B" stroke-opacity="0.3" stroke-width="1" />
    <text x="455" y="20" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E68817">Where Loyalty Becomes an Asset</text>
    <text x="590" y="20" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">— Mengubah loyalitas belanja menjadi kepemilikan aset digital riil.</text>
  </g>
</svg>